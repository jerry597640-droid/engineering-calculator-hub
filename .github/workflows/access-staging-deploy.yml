name: Engineering access staging deploy
on:
  push:
    branches: [codex/engineering-access-staging-20261126]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-access-staging
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: github.repository == 'jerry597640-droid/engineering-calculator-hub' && github.ref == 'refs/heads/codex/engineering-access-staging-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: access-control-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect available query-string privacy setting
        run: node -e "const s=require('node:fs').readFileSync('node_modules/wrangler/config-schema.json','utf8');console.log('redact_query_string_supported='+s.includes('redact_query_string'))"
      - name: Verify authorization and SDK integration
        run: npm test
      - name: Check deploy bundle
        run: npx wrangler deploy --dry-run --outdir .staging-dry-run
      - name: Check whether deployment is configured
        id: readiness
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped; the staging token is not configured."
          fi
      - name: Deploy the isolated staging Worker
        if: steps.readiness.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c4291ea6933452f275090a2819b25e9
        run: npx wrangler deploy --keep-vars
      - name: Verify anonymous requests cannot read pilot tools
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          site='https://engineering-tools-access-staging.jerry597640.workers.dev'
          check() {
            local path="$1" expected="$2" status
            status=$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 -D /tmp/ech-headers -o /tmp/ech-body -w '%{http_code}' "$site$path")
            test "$status" = "$expected" || { echo "Unexpected HTTP $status for $path (expected $expected)"; exit 1; }
            tr -d '\r' < /tmp/ech-headers | grep -qi '^cache-control:.*no-store'
          }
          check '/login' 200
          check '/forgot-password' 200
          check '/reset-password' 303
          check '/tools/rc-slab-auto-design/index.html' 401
          check '/tools/rebar/index.html' 401
          check '/assets/tools/rebar/index.html' 404
      - name: Sweep anonymous access to every staged tool
        if: steps.readiness.outputs.ready == 'true'
        run: node anonymous-asset-sweep.mjs
      - name: Verify real browser form submission
        if: steps.readiness.outputs.ready == 'true'
        run: node browser-form-test.mjs
