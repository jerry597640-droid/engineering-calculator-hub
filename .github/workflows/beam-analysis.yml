name: Beam analysis verification
on:
  push:
    paths:
      - 'beam-analysis/**'
      - 'index.html'
      - '.github/workflows/beam-analysis.yml'
  pull_request:
    paths:
      - 'beam-analysis/**'
      - 'index.html'
      - '.github/workflows/beam-analysis.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: beam-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: node tests/verify.cjs
      - run: node tests/verify-spans.cjs
      - run: python tests/verify-independent.py
      - run: python tests/verify-static.py
      - run: node tests/verify-hub.cjs
      - run: git diff --exit-code -- index.html
      - run: npm install --no-save --no-package-lock jsdom@26.1.0
      - run: node tests/verify-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-analysis-verification
          path: beam-analysis/tests/*validation.json
          if-no-files-found: ignore
