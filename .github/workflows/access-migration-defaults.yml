name: Compare engineering tool migration defaults
on:
  push:
    branches: [codex/engineering-access-migration-prep]
    paths:
      - 'access-control-staging/compare-migration-defaults.mjs'
      - '.github/workflows/access-migration-defaults.yml'
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'jerry597640-droid/engineering-calculator-hub' && github.ref == 'refs/heads/codex/engineering-access-migration-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out prepared candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned original hub
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: de4bffdd0d99698e33ee1dee569d1608247263c2
          path: .baseline-sources/hub
          persist-credentials: false
      - name: Check out original rebar tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/rebar-wire-mesh-converter
          ref: 24ce3370e6c4edf1639623b29bad127923d5fedc
          path: .baseline-sources/rebar
          persist-credentials: false
      - name: Check out original seismic tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/seismic-force-calculator
          ref: fba583b71211d5c1eed65a569df7244ef133527c
          path: .baseline-sources/seismic
          persist-credentials: false
      - name: Check out original formwork tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/formwork-support-calculator
          ref: 4d26caa29e0e2a6b85b5111b77b74744689de691
          path: .baseline-sources/formwork
          persist-credentials: false
      - name: Check out original RC beam tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/rc-beam-design-calculator
          ref: 58646ab56935b2ef45678a3a3e359636a24742ae
          path: .baseline-sources/rc-beam
          persist-credentials: false
      - name: Check out original slab tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/slab-analysis-design
          ref: 9d1b7d4035cb51a0e6a91a5e25b0052a08b51315
          path: .baseline-sources/slab-analysis
          persist-credentials: false
      - name: Check out original wind tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/wind-load-analysis
          ref: 49635ca0676b52c93197c2aeab1261fc1529718f
          path: .baseline-sources/wind
          persist-credentials: false
      - name: Check out original scaffold tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/scaffold-analysis-calculator
          ref: 89d3d61c237f1d005102ca7e42e2ea29e6ccaecd
          path: .baseline-sources/scaffold
          persist-credentials: false
      - name: Check out original steel tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/steel-column-design
          ref: b6c8128d2dbfebe4938ffd602f3cd8cbf4b6b27a
          path: .baseline-sources/steel
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare default inputs and visible numerical outputs
        run: node access-control-staging/compare-migration-defaults.mjs
