name: Engineering migration numeric regression
on:
  push:
    branches: [codex/engineering-access-migration-prep]
    paths: ['.github/workflows/access-migration-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'jerry597640-droid/engineering-calculator-hub' && github.ref == 'refs/heads/codex/engineering-access-migration-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out prepared candidates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned hub test fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: de4bffdd0d99698e33ee1dee569d1608247263c2
          path: .regression-sources/hub
          persist-credentials: false
      - name: Check out formwork test fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/formwork-support-calculator
          ref: 4d26caa29e0e2a6b85b5111b77b74744689de691
          path: .regression-sources/formwork
          persist-credentials: false
      - name: Check out slab test fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/slab-analysis-design
          ref: 9d1b7d4035cb51a0e6a91a5e25b0052a08b51315
          path: .regression-sources/slab
          persist-credentials: false
      - name: Check out seismic test fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/seismic-force-calculator
          ref: fba583b71211d5c1eed65a569df7244ef133527c
          path: .regression-sources/seismic
          persist-credentials: false
      - name: Check out scaffold test fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jerry597640-droid/scaffold-analysis-calculator
          ref: 89d3d61c237f1d005102ca7e42e2ea29e6ccaecd
          path: .regression-sources/scaffold
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Copy test fixtures into temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          stage=access-control-staging/assets/tools
          for tool in aluminum-formwork src-beam-column slope-stability beam-analysis; do
            mkdir -p "$stage/$tool/tests"
          done
          cp .regression-sources/hub/aluminum-formwork/tests/verify.cjs "$stage/aluminum-formwork/tests/"
          cp .regression-sources/hub/src-beam-column/tests/verify-regression.js "$stage/src-beam-column/tests/"
          cp .regression-sources/hub/slope-stability/tests/verify-regression.cjs "$stage/slope-stability/tests/"
          cp .regression-sources/hub/slope-stability/verification.json "$stage/slope-stability/"
          cp .regression-sources/hub/beam-analysis/tests/verify.cjs "$stage/beam-analysis/tests/"
          mkdir -p "$stage/formwork/tests" "$stage/slab-analysis/tests" "$stage/seismic/tests"
          cp .regression-sources/formwork/tests/regression.cjs .regression-sources/formwork/tests/legacy-engine-baseline.cjs "$stage/formwork/tests/"
          cp .regression-sources/slab/tests/modern-section.cjs "$stage/slab-analysis/tests/"
          cp .regression-sources/seismic/tests/verify.py "$stage/seismic/tests/"
          cp .regression-sources/scaffold/test-engine.cjs "$stage/scaffold/"
          for tool in aluminum-formwork src-beam-column slope-stability beam-analysis formwork slab-analysis seismic scaffold; do
            printf '%s\n' '{"type":"commonjs"}' > "$stage/$tool/package.json"
          done
      - name: Run numeric regression cases
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          run_case() {
            local label="$1"
            shift
            if "$@"; then
              echo "REGRESSION $label PASS"
            else
              echo "REGRESSION $label FAIL"
              failed=1
            fi
          }
          stage=access-control-staging/assets/tools
          run_case aluminum node "$stage/aluminum-formwork/tests/verify.cjs"
          run_case src-beam-column node "$stage/src-beam-column/tests/verify-regression.js"
          run_case slope node "$stage/slope-stability/tests/verify-regression.cjs"
          run_case beam node "$stage/beam-analysis/tests/verify.cjs"
          run_case formwork node "$stage/formwork/tests/regression.cjs"
          run_case slab node "$stage/slab-analysis/tests/modern-section.cjs"
          run_case seismic python3 "$stage/seismic/tests/verify.py"
          if (cd "$stage/scaffold" && node test-engine.cjs); then
            echo "REGRESSION scaffold PASS"
          else
            echo "REGRESSION scaffold FAIL"
            failed=1
          fi
          exit "$failed"
