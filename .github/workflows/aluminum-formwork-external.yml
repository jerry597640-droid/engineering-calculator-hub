name: Aluminum formwork external verification
on:
  push:
    paths:
      - 'aluminum-formwork/engine.js'
      - 'aluminum-formwork/tests/**'
      - '.github/workflows/aluminum-formwork-external.yml'
  pull_request:
    paths:
      - 'aluminum-formwork/engine.js'
      - 'aluminum-formwork/tests/**'
      - '.github/workflows/aluminum-formwork-external.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-beams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r aluminum-formwork/tests/requirements-external.txt
      - run: python aluminum-formwork/tests/verify-external.py
      - uses: actions/upload-artifact@v4
        with:
          name: aluminum-formwork-independent-results
          path: aluminum-formwork/tests/external-validation.json
          if-no-files-found: ignore
