name: Slope stability regression
on:
  push:
    paths:
      - 'slope-stability/**'
      - '.github/workflows/slope-stability.yml'
  pull_request:
    paths:
      - 'slope-stability/**'
      - '.github/workflows/slope-stability.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: slope-stability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: node tests/verify-controls.cjs
      - run: node tests/verify-regression.cjs
      - run: python tests/verify.py
      - run: python build.py
      - run: git diff --exit-code -- index.html
