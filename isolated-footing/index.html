function moments(p){let r=[0,0,0,0,0,0];if(p.length<3)return r;for(let i=1;i<p.length-1;i++){let t=[p[0],p[i],p[i+1]],A=Math.abs((t[1][0]-t[0][0])*(t[2][1]-t[0][1])-(t[2][0]-t[0][0])*(t[1][1]-t[0][1]))/2;for(let j=0;j<3;j++){let x=(4*t[j][0]+t[(j+1)%3][0]+t[(j+2)%3][0])/6,y=(4*t[j][1]+t[(j+1)%3][1]+t[(j+2)%3][1])/6;r[0]+=A/3;r[1]+=A*x/3;r[2]+=A*y/3;r[3]+=A*x*x/3;r[4]+=A*x*y/3;r[5]+=A*y*y/3}}return r}

function helpRender(){$('helpview').innerHTML=panel('從資料到結果',`<p>建議依序完成幾何、荷載、地盤及配筋。任何輸入變動都會立即重算，圖示選單可切換同一組合的接觸圖。</p><ol><li>由基礎圖填 L、B、h、Df、柱尺寸與柱偏位。</li><li>由結構分析填「同一荷載組合」的柱反力。Mx、My 先轉移到基底水平面，柱偏位另由程式加計。</li><li>由地質報告填 qa、水位、土重及界面摩擦；確認總／淨容許承載力。</li><li>填兩向鋼筋號數、中心距及上下層關係，查看有效深度及配筋需求。</li><li>查看計算明細，每一使用組合檢核承載、滑動、傾覆；每一強度組合檢核四側彎矩、單向剪力、沖切及配筋。</li><li>儲存案例為 JSON；下載離線 HTML；列印計算書可用瀏覽器「另存 PDF」。</li></ol>`)+panel('可照著輸入的範例',`<div id="examples" class="examplebuttons"><button data-example="source">原尺寸重建</button><button data-example="safe">厚度調整範例</button><button data-example="ecc">雙向偏心</button><button data-example="partial">部分接觸</button></div><h3>範例 A｜原尺寸重建，不保證合格</h3>${tbl(['欄位','輸入'],[['L / B','4.1 / 4.1 m'],['h / Df','85 cm / 1.5 m'],['cx / cy / ex / ey','0.75 / 0.30 / 0 / 0 m'],['fc′ / fy','210 / 4200 kgf/cm²'],['保護層 / 下層筋','7.5 cm / X 向'],['底筋','#8 @ 20 cm，兩向'],['qa（總） / γs / qs','22.5 tf/m² / 0.91 tf/m³ / 0.5 tf/m²'],['使用 N / 強度 N','315 tf / 434 tf；Mx=My=Hx=Hy=0'],['埋置柱自重','勾選另加']])}<p style="margin-top:12px">原程式 cover=8.73 cm；本範例改以淨保護層7.5 cm及兩層鋼筋重建。對照：Wc = 34.2924 tf、S1 qmax = 21.8766 tf/m²、dx = 76.23 cm、dy = 73.69 cm。U1 單向剪力比約 1.1818，沖切比約 0.9930，原尺寸依新版公式為 NG。0.91 tf/m³ 為舊程式測試值，實案請改地質報告值。</p><h3>範例 B｜厚度與材料調整</h3><p>以 A 為起點，h 改 100 cm、fc′ 改 280、γs 改 1.8 tf/m³、qa 改 30 tf/m²；其餘相同。先查看已列檢核結果，再比較厚度增加對自重及兩向剪力的影響。</p><h3>範例 C、D｜偏心與脫離</h3><p>C 顯示柱偏位與雙向彎矩。D 顯示 qmin=0 的部分接觸，尺寸效應自動納入；反向彎矩會標示需上層筋，傾覆或剪力不足不會被掩蓋。</p>`)+panel('輸入欄位與資料來源',tbl(['欄位','單位','定義／資料來源'],Object.values(defs).map(([n,u,h])=>[n,u,h]))+`<h3>荷載組合表</h3>${tbl(['欄位','來源與填法'],[['使用 S','結構分析使用載重反力，檢查地盤及穩定。'],['強度 U','結構分析因數化反力，檢查 RC。不要再將已因數化內力乘係數。'],['N','柱頂向下壓力為正；由分析反力換成 tf。'],['Mx / My','tf·m，已移至基底水平面。正 Mx 使 +Y 反力減小、正 My 使 +X 反力增加；ex、ey 另加。'],['Hx / Hy','tf，本組合同時發生的水平力，只用於滑動。若分析模型支點在基礎頂面，先在外部完成向基底的力矩轉移。'],['自重／覆土係數 wf','使用組合通常 1；1.2D+1.6L 通常填1.2；1.4D填1.4。此係數同時乘水浮力，地下水不利係數不同時另用專案組合核算。'],['qa 倍率','預設1；地震／風提高承載力須有地質或適用規範依據，不自動提高。'],['柱自重勾選','反力已含基礎頂面以上柱重時取消，避免重複。']])}`)+panel('適用條件與待另核項目',`<p>本版適用常重混凝土、矩形等厚、RC 柱、無剪力筋的獨立基腳；剛性基礎土壤反力採無拉力線性接觸。土壤承載能力以工程師提供之 qa 檢核，不用此工具取代鑽探或承載試驗。</p><ul><li>內柱 d/2 四邊周界：自動檢核沖切與雙向彎矩傳遞。</li><li>周界觸及基礎邊界：停止內柱沖切判定，邊柱／角柱須另行設計。</li><li>柱面出現反向彎矩：明確標示需要上層筋，底筋通過不表示上層筋已完成。</li><li>整體軸向受壓力 ≤0、合力越出基底：回報無接觸平衡，不產生假合格數字。</li><li>沉陷、差異沉陷、液化、鄰近開挖、施工階段、支承壓應力、柱插筋、伸展長度及耐震連結另核。</li><li>土壓選項保留原程式 Rankine 機制，滑動可試算；不計有利土壓傾覆力矩。單側土壓及被動反力若納入柱底彎矩，須由專案力學模型處理。</li><li>偏心基底有反向彎矩或局部複雜柱帶時，均勻底筋配法僅供已列斷面檢核，不能取代詳細構造設計。</li></ul>`)+panel('規範與公式追溯',`<p>核對日期：2026-10-05。採臺灣112年版混凝土與基礎規範，113年1月1日生效；混凝土規範含113年2月19日勘誤。</p><ul><li><a target="_blank" rel="noopener" href="https://www.nlma.gov.tw/ch/legislation/regsearch/6874">國土署：建築物混凝土結構設計規範</a>：第13章、22.5、22.6、8.4、8.6、21.2。</li><li><a target="_blank" rel="noopener" href="https://www.nlma.gov.tw/filesys/file/EMMA/c1130219-1.pdf">混凝土規範112年版全文</a>：單向剪力納入鋼筋比；連續承壓淺基礎可用 λs=1。</li><li><a target="_blank" rel="noopener" href="https://www.nlma.gov.tw/ch/legislation/law%26regusw/962">國土署：建築物基礎構造設計規範</a>：使用荷載地反力、地盤及穩定設計依據。</li><li>原始資料：Foundation_20121009_SourceCode.zip，FormMain.vb；原預設自重、組合及剪力方法的差異見計算明細。</li></ul><p>PASS 代表目前已輸入組合及已列檢核通過；NG 代表有數值檢核不合格；REVIEW 代表存在待專案複核條件。</p>`)+panel('離線與資料保存',`<p>下載離線版後直接用 Chrome、Edge、Firefox 或 Safari 開啟 HTML。全部計算、圖示、操作說明與範例在檔案內，無 CDN 或網路依賴；規範外部連結仍需連線。手機可在具備 HTML 開啟功能的瀏覽器／檔案管理器使用，檔案預覽器可能不執行 JavaScript。</p><p>案例不會自動上傳。用「儲存案例」保存 JSON，再以「開啟案例」匯入。離線版會包含下載當下的輸入。列印計算書會自動切到完整明細，不把表單截圖當作計算書。</p>`);for(const b of document.querySelectorAll('[data-example]'))b.onclick=()=>loadExample(b.dataset.example);}
function setTab(t){tab=t;document.querySelectorAll('nav [data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===t);b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')});$('workview').hidden=['report','help'].includes(t);$('reportview').hidden=t!=='report';$('helpview').hidden=t!=='help';if(t==='help')helpRender();else if(t!=='report')inputRender();recalc();window.scrollTo({top:0,behavior:'instant'})}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>setTab(b.dataset.tab);$('diagramCase').onchange=e=>{selected=Number(e.target.value);draw()};
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('saveBtn').onclick=()=>{if(result.errors.length){notify('請先修正輸入錯誤');return}download(JSON.stringify({format:'isolated-footing-v1',data},null,2),'獨立基礎案例.json','application/json')};$('openBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>500000)throw Error('案例檔不可超過500 KB');let o=JSON.parse(await f.text());if(o.format!=='isolated-footing-v1')throw Error('案例格式不符');let candidate={...clone(Footing.defaults),...o.data},v=Footing.validate(candidate);if(v.length)throw Error(v.join('；'));data=candidate;selected=0;setTab('geometry');notify('案例已開啟')}catch(err){notify(err.message)}e.target.value=''};
$('offlineBtn').onclick=()=>{if(result.errors.length){notify('請先修正輸入錯誤');return}let doc=document.documentElement.cloneNode(true);doc.querySelector('#initial-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');doc.querySelector('#toast').hidden=true;download('<!doctype html>\n'+doc.outerHTML,'獨立基礎設計_離線版.html','text/html;charset=utf-8');notify('已下載含目前輸入的單檔離線版')};$('printBtn').onclick=()=>{if(result.errors.length){notify('請先修正輸入錯誤');return}setTab('report');window.print()};$('exampleBtn').onclick=()=>{setTab('help');$('examples').scrollIntoView({behavior:'smooth',block:'center'})};setTab('geometry');
</script>
