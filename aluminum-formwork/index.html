function renderConditions(){const r=result;$('conditions').innerHTML=`<div class="card-heading"><h2>檢核範圍與待確認資料</h2><span class="badge warn">${r.pending.length} 項待核定</span></div><div class="conditions-body">${r.failures.length?'<h3>目前控制項目</h3><ul>'+r.failures.map(c=>`<li>${esc(c.group)}／${esc(c.label)}：${fmt(c.ratio,3)}，請調整支承間距、斷面或容許力。</li>`).join(''):'<p>已計算項目符合目前輸入的容許值。</p>'}${r.warnings.length?'<h3>本次模型提示</h3><ul>'+r.warnings.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}${r.pending.length?`<details ${r.failures.length?'':'open'}><summary>展開 ${r.pending.length} 項核定依據／模型範圍</summary><ul>${r.pending.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="small-action" data-jump-review>前往「核定依據」</button></details>`:''}<p class="source-note">數值 OK 依目前模型與輸入容許值判定。未納入的施工階段、邊框焊道、整體穩定及回撐，依核定施工圖與設計計算另行確認。</p></div>`;}
function switchView(k){view=k;for(const id of ['dashboard','report','manual','reference','chapters'])$(id+'View').hidden=id!==k;document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===k));if(k==='report')renderReport();if(k==='manual')renderManual();if(k==='reference')renderReference();if(k==='chapters')renderChapters();$('resultPane').scrollTop=0;}
function loadCalculations(r){const p=r.pressure,v=r.vertical;return r.lateral?`<h3>1. 混凝土側壓力</h3><div class="formula">ρ=${fmt(s.density,0)} kg/m³；g=9.80665 m/s²；H=${fmt(p.H)} m<br>ρgH = ${fmt(p.gamma,5)} × ${fmt(p.H)} = ${fmt(p.hydro,5)} kPa<br>Cw=${fmt(p.Cw,4)}；Cc=${fmt(p.Cc,2)}；R=${fmt(s.rate,2)} m/h；T=${fmt(s.temperature,2)} °C<br>${esc(p.eq)} = ${fmt(p.raw,5)} kPa<br>${['b','c'].includes(p.kind)?`pmax = min(ρgH, max(30Cw, p式)) = ${fmt(r.p,5)} kPa`:`pmax = ${fmt(r.p,5)} kPa`} = ${fmt(r.p/A.KF,3)} kgf/m²</div><p>${esc(p.reason)}。各構件以最大壓力均布檢核；示意壓力曲線不拿來降低最不利構件載重。</p>`:`<h3>1. 梁版垂直工作載重</h3><div class="formula">混凝土 = ${fmt(s.rcDensity,0)} × g × ${fmt(s.depth/100,3)} /1000 = ${fmt(v.concrete,5)} kPa<br>模板 = ${fmt(s.formWeight,1)} × 0.00980665 = ${fmt(v.form,5)} kPa<br>額外靜載 = ${fmt(v.extra,5)} kPa<br>另加衝擊 = ${fmt(v.concrete,5)} × ${fmt(s.impact,1)}% = ${fmt(v.impact,5)} kPa<br>${s.loadRule==='reference'?'參考書重算不另加施工活載':`施工活載 = max(${fmt(v.userLive,5)}, ${fmt(v.minLive,1)}) = ${fmt(Math.max(v.userLive,v.minLive),5)} kPa`}<br>q = ${s.loadRule==='reference'?'自重＋模板＋額外靜載＋衝擊':'max(全部載重總和, '+fmt(v.minTotal,1)+' kPa)'} = ${fmt(v.q,5)} kPa = ${fmt(v.q/A.KF,3)} kgf/m²</div><p>30% 為原書專案假定，本工具設計模式把衝擊另加於 ACI 施工活載，採保守組合。多層施工傳遞荷重需另作施工階段分析。</p>`;}
function reportBody(){if(!result?.valid)return'<div class="prose">請先修正輸入。</div>';const r=result;return`<div class="view-title"><span class="section-kicker">CALCULATION RECORD / 可追溯計算</span><h2>${esc(s.project)}・計算書</h2><p>${esc(s.location)} · ${MODES[s.mode]} · v${A.VERSION} · ${new Date().toLocaleDateString('zh-TW')}<br>${statusText(r)}</p></div><section class="card"><div class="prose">${loadCalculations(r)}<h3>2. 計算方法與單位</h3><p>內部統一 N、mm、MPa。1 kgf = 9.80665 N；1 kgf/cm² = 0.0980665 MPa；1 kgf/m² = 0.00980665 kPa。面板採 1000mm 寬單向條帶，I=bt³/12，S=bt²/6，Av=2bt/3。</p><p>梁採 Euler–Bernoulli 線彈性直接勁度法。等EI、支點位移為零，可選不等跨與外端固定轉角；均布載重各跨同時滿載。集中力節點精確設置；均布荷重採一致節點力與四次特解恢復跨內撓度。求取全跨正負彎矩絕對最大、剪力最大及撓度最大；本版不含支承沉陷、懸臂及施工活載花載。</p></div>${r.members.map(m=>`<div class="report-member"><h3>${m.name}</h3><p>跨距=${m.lengths.map(v=>fmt(v,0)).join(" / ")}mm，${endLabels[m.ends]}，${m.spans} 跨，分攤寬=${fmt(m.trib,1)}mm${m.count>1?'／'+m.count+' 支均分':''}，${({uniform:'均布載重',points:'等分區中央集中力',explicit:'指定位置集中力',ribReactions:'連動縱肋最大反力'})[m.loadMode]}</p><div class="formula">w = p × 分攤寬 / 1000${m.count>1?' / '+m.count:''} = ${fmt(m.q,6)} N/mm<br>I=${fmt(m.I/1e4,5)} cm⁴；S=${fmt(m.S/1e3,5)} cm³；Av=${fmt(m.Av/100,5)} cm²；E=${fmt(m.E,2)} MPa<br>${m.loadMode!=='uniform'?'集中載重（x mm : P kN）：'+m.points.map(p=>fmt(p.x,1)+':'+fmt(p.P/1000,4)).join('；')+'<br>':''}M正=${fmt(m.Mpositive/1e6,6)}kN·m；M負=${fmt(m.Mnegative/1e6,6)}kN·m<br>|M|max=${fmt(m.Mmax/1e6,6)} kN·m = ${fmt(m.Mmax/98.0665,3)} kgf·cm，位置 x=${fmt(m.xM,2)}mm<br>Vmax=${fmt(m.Vmax/1000,6)} kN = ${fmt(m.Vmax/A.G,3)} kgf<br>δmax=${fmt(m.deflection,6)}mm，位置 x=${fmt(m.xD,2)}mm<br>反力（kN）：${m.reactions.map(a=>fmt(a.R/1000,5)).join('，')}<br>固定端反力矩（kN·m）：${m.reactions.map(a=>fmt(a.M/1e6,6)).join('，')}<br>逐跨撓度／容許（mm）：${m.deltaSpans.map(v=>'第'+(v.index+1)+'跨 '+fmt(v.deflection,4)+'/'+fmt(v.allow,4)).join('；')}<br>${m.geometry?'幾何自算：A='+fmt(m.geometry.area/100,5)+'cm²；Q='+fmt(m.geometry.Q/1000,5)+'cm³；Av='+fmt(m.Av/100,5)+'cm²<br>':''}力平衡殘差=${m.equilibrium.toExponential(2)} N；力矩殘差=${m.momentResidual.toExponential(2)} N·mm</div>${m.checks.map(c=>`<div class="report-line"><span>${esc(c.formula)}；${fmt(c.demand,4)} ≤ ${fmt(c.capacity,4)} ${c.unit}，D/C=${fmt(c.ratio,4)}</span><span class="badge ${c.pass?'':'fail'}">${c.pass?'OK':'NG'}</span></div>`).join('')}</div>`).join('')}</section><section class="card"><div class="prose"><h3>3. 連接、支柱與斜撐</h3>${r.tie?`<div class="formula">拉結 T = ${fmt(r.p,5)} × ${fmt(s.tieX,0)} × ${fmt(s.tieY,0)} / 10⁶ = ${fmt(r.tie.demand,5)} kN = ${fmt(r.tie.demand/A.KF,3)} kgf<br>Ra = min(${fmt(s.tieCapacity,0)}, ${fmt(s.tieConnection,0)}) = ${fmt(r.tie.capacity/A.KF,3)} kgf<br>僅依拉力容量：固定 sy 時 sx ≤ ${fmt(r.tie.sxMax,1)}mm；固定 sx 時 sy ≤ ${fmt(r.tie.syMax,1)}mm（仍須重新檢核其他構件）</div>`:''}<div class="formula">銷釘 N = p × sx × sy = ${fmt(r.pin.N,5)} kN<br>鋼材剪力容許 = A Fv × 剪面數 = ${fmt(r.pin.shear,5)} kN<br>Ra = min(鋼材剪力, 孔壁／邊距, 整組容許) = ${fmt(r.pin.capacity,5)} kN</div>${r.prop?columnReport(r.prop):''}${r.brace?braceReport(r.brace):''}</div><div class="table-wrap">${checksHTML(r.checks.filter(c=>!r.members.some(m=>m.checks.includes(c))))}</div></section><section class="card"><div class="prose"><h3>4. 核定依據與未完成範圍</h3>${['materialSource','sectionSource','connectionSource','propSource','windSource','contractSource'].map(k=>`<p><b>${esc(fMap[k].label)}</b>：${esc(s[k])}</p>`).join('')}<ul>${[...r.warnings,...r.pending].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>此計算不取代核定施工圖及簽章計算；邊框與焊道細部、施工花載、整體穩定、回撐及下層樓板承載需另行核定。</p><h3>5. 規範及來源</h3>${sources.map(x=>`<p><b>${x.title}</b>：${x.note}<br>${esc(x.url)}</p>`).join('')}</div></section>`;}
function columnReport(p){return`<h3>鋼管支柱：參考書 ASD 柱式</h3><div class="formula">A=π(D²−d²)/4；I=π(D⁴−d⁴)/64；r=√(I/A)<br>內管 A=${fmt(p.inner.A/100,5)}cm²；I=${fmt(p.inner.I/1e4,5)}cm⁴；r=${fmt(p.inner.r/10,5)}cm<br>λ=KL/r=${fmt(p.inner.lambda,5)}；Cc=√(2π²E/Fy)=${fmt(p.inner.Cc,5)}<br>λ≥Cc：Fa=12π²E/(23λ²)<br>λ&lt;Cc：Fa=[1−0.5(λ/Cc)²]Fy/[5/3+3(λ/Cc)/8−(λ/Cc)³/8]<br>分支：${p.inner.branch}；Fa=${fmt(p.inner.Fa/A.ST,3)}kgf/cm²<br>內管 Pa=${fmt(p.inner.Pa/A.KF,2)}kgf；外管 Pa=${fmt(p.outer.Pa/A.KF,2)}kgf<br>原廠容許=${fmt(s.propCapacity,0)}kgf；底座容許=${fmt(s.propBaseCapacity,0)}kgf<br>每支面積=${fmt(p.area/1e6,5)}m²；連續反力包絡係數=${fmt(p.reactFactor,4)}<br>N=(q Atrib C反力 + ${fmt(s.propExtra,0)}kgf) × ${fmt(s.distribution,3)} = ${fmt(p.N/A.KF,3)}kgf<br>Ra=min(內管,外管,原廠,底座)=${fmt(p.capacity/A.KF,3)}kgf<br>λ=${fmt(p.inner.lambda,3)} ${p.inner.slender?'＞':'≤'} 200<br>內管 D/t=${fmt(p.inner.wallRatio,3)}；局部挫屈初篩界線 0.11E/Fy=${fmt(p.inner.localLimit,3)}</div><p>此式是參考計算書之 ASD 重算模型；有效長度與原廠載重曲線必須核定，不能據此聲稱已自動完成現行全部鋼結構條文。</p>`;}
function braceReport(b){return`<h3>組立抗風斜撐</h3><div class="formula">H = ${fmt(s.wind,3)} × ${fmt(s.braceSpacing,3)} × ${fmt(result.pressure.H,3)} = ${fmt(b.H,5)} kN<br>cosθ=${fmt(s.braceRun,3)}/${fmt(s.braceLength,3)}；θ=${fmt(b.angle,3)}°<br>N=H/cosθ=${fmt(b.N,5)}kN；V=Nsinθ=${fmt(b.V,5)}kN<br>斜撐 λ=${fmt(b.steel.lambda,3)}；鋼管理論容許=${fmt(b.steel.Pa/A.KF,2)}kgf<br>Ra=min(理論軸壓,整支斜撐容許)=${fmt(b.capacity/A.KF,2)}kgf</div><p>水平與垂直錨點檢核分列；同一錨點的拉剪交互作用、混凝土基材及組立整體抗傾覆需在核定計算書補足。</p>`;}
function renderReport(){$('reportView').innerHTML=reportBody();}
const sources=[{title:'ACI PRC-347-14(21)',url:'https://www.concrete.org/Portals/0/Files/PDF/CEU-347R-14.pdf',note:'§4.2.1 垂直載重、§4.2.2 側壓力與底部泵送，表 4.2.2.1b、Cc 及 Cw。官方 2026 資源仍列重審 2021 版；查核 2026-10-18。'},{title:'Aluminum Design Manual 2020',url:'https://www.aluminum.org/aluminum-design-manual-2020',note:'鋁材容許值、局部及側向挫屈、焊接熱影響與有效斷面之核定依據；本工具接受核定有效容許值，未自動實作全冊條文。'},{title:'營造安全衛生設施標準',url:'https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060014',note:'官方顯示 115/06/30 修正；第 130、131、133～136 條之材料、設計、支柱及作業管理。新增第11-2條另有116/7/1生效日；本工具未混用該未生效條文。'},{title:'桃工規第03110章 V3.0（2024/10）',url:'https://ws.tycg.gov.tw/Download.ashx?n=56ysMDMxMTDnq6Ag5aC06ZGE57WQ5qeL5re35Yed5Zyf55So5qih5p2%2FVjMgMjAyNDEwMzAo5pa95bel6KaP56%2BEKS5wZGY%3D&u=LzAwMS9VcGxvYWQvNjkvcmVsZmlsZS85OTQ2LzEwNTIvMTdmZGNiYzQtOGExMy00ZjNhLWFiMTMtMGE3Yjg5Njg4ODlmLnBkZg%3D%3D',note:'§1.5.4 撓度原則 L/240；本工具預設沿用參考書 L/360 較嚴值，可依契約調整，並非宣稱全國一律 L/360。'},{title:'使用者提供之鋁模板支撐 A 版計算書',url:'',note:'115/09，第2～7頁材料與載重、第8～24頁柱牆、第25～49頁梁、第50～53頁樓板。公開程式僅保留計算參數與差異說明，未上傳原計算書。'}];
const examples=[['wall','牆模板・原圖模型','固定端、不等跨縱肋及連動集中力。'],['column','柱模板・90cm柱邊','柱箍座標由圖反推，待施工圖核對。'],['smallBeam','小梁底模・35×70cm','300+300mm縱肋、單排支柱。'],['largeBeam','大梁底模・50×80cm','375+350+375mm縱肋；q=2521kgf/m²。'],['beamSide','小梁側模・70cm高','液壓1610kgf/m²及固定端肋材。'],['largeBeamSide','大梁側模・背楞30cm','依原第44頁30cm分攤高度重算。'],['largeBeamSide55','大梁側模・背楞55cm','依配置說明55cm檢查彎曲與撓度NG。'],['slab','樓板15cm・原書重算','q=493kgf/m²；龍骨撓度約5.28mm。'],['slab20','樓板20cm・厚度比較','q=649kgf/m²；龍骨撓度約6.95mm。'],['hydro','SCC全液壓敏感度','同一模板配置改用全液壓比較。']];
function renderManual(){let intro=`<div class="view-title"><span class="section-kicker">USER GUIDE / 操作說明</span><h2>從施工圖到檢核結果</h2><p>先定荷重與傳力，再輸入斷面和容許值。每個欄位的 ⓘ 都會帶您到定義及資料來源。</p></div><section class="card"><div class="prose"><h3>建議操作順序</h3><div class="case-steps"><div class="case-step"><b>01</b>選牆、柱、梁側、梁底或樓板，先載入接近的範例。</div><div class="case-step"><b>02</b>按核定施工圖輸入幾何、支承、間距，按配比與澆置計畫輸入載重。</div><div class="case-step"><b>03</b>用材證與原廠試驗替換容許值，檢查控制項、計算過程後匯出。</div></div><h3>照著輸入：牆模板</h3><p>選牆模板原圖模型：側壓採3825kgf/m²，面板跨135mm兩端固定；縱肋550,400,350,300,300,300mm兩外端固定。橫肋以135:1;250:0.92;365:1連動縱肋反力，拉片500×400mm需求為765kgf。</p><p>切回ACI條件判斷，T=21°C、R=1.5m/h、Cw=Cc=1，側壓為37.54794kPa，拉片需求765.765kgf。</p><p>縱肋若只有21×15mm實心矩形，可改斷面自算：I約1.1576cm⁴，撓度約1.665mm，會超過550/360=1.528mm。須以型材有效斷面證明共同作用。</p><h3>照著輸入：樓板載重差異</h3><p>選樓板厚15cm。切「比對：原書自重＋30%衝擊」時，q=(2400×0.15×1.3)+25=<b>493kgf/m²</b>。切回設計模式，施工活載250kgf/m²另加，q=<b>743kgf/m²</b>（7.28634kPa）。原書值不是自動符合 ACI 活載下限。</p><h3>閱讀結果</h3><p>點四張構件卡可切換該梁的受力與彎矩圖。D/C≤1僅表示該項數值通過；資料不足時總狀態顯示「依據待核定」。右圖可釘選，兩個工作區各自捲動；手機用下方輸入／結果／圖形切換。</p><h3>下載、備份與離線</h3><p>「下載單檔離線版」會包含當下輸入，不依賴網路字型或外部程式庫。下載HTML後直接開啟；手機請用可執行HTML的瀏覽器或本機網頁環境。JSON用於跨裝置備份；CSV可由Excel開啟；Word為原生DOCX，列印可另存PDF。瀏覽器儲存被封鎖時，請用JSON備份。</p><h3>分析範圍</h3><p>本版為五類模板構件與局部系統檢核，支援固定端、不等跨、指定集中力及縱肋反力連動，每跨分別檢查撓度。整體側移、施工花載、支承沉陷、邊框焊道、錨點交互作用、多層回撐及下層樓板承載另行分析。面板與型材容許值需涵蓋局部／側向挫屈、焊接及實際合金調質。</p></div></section><div class="view-title"><h2>輸入參數字典</h2><p>${fields.length} 項欄位，含定義、單位及建議資料來源。</p><input id="manualSearch" class="manual-search" type="search" placeholder="搜尋參數、公式、材料或來源…" value="${esc(manualFilter)}" aria-label="搜尋參數說明"></div><div class="manual-categories">${[['all','全部'],...Object.entries(GROUPS)].map(([k,l])=>`<button data-manual-cat="${k}" class="${manualCat===k?'active':''}">${l}</button>`).join('')}</div><div class="card table-wrap" id="paramTable"></div>`;$('manualView').innerHTML=intro;renderParamTable();}
function renderParamTable(){const keys=manualCat==='all'?null:new Set(sections[manualCat].flatMap(g=>g.fields.map(f=>f.key))),q=manualFilter.toLowerCase().trim(),fs=fields.filter(f=>(!keys||keys.has(f.key))&&(!q||[f.key,f.label,f.description,f.source].join(' ').toLowerCase().includes(q)));$('paramTable').innerHTML=`<table class="param-table"><thead><tr><th>欄位／單位</th><th>定義與填寫方式</th><th>資料來源</th></tr></thead><tbody>${fs.map(f=>`<tr><td>${esc(f.label)}${f.unit?'<br><span class="source-note">'+esc(f.unit)+'</span>':''}</td><td>${esc(f.description)}</td><td>${esc(f.source)}</td></tr>`).join('')}</tbody></table>${fs.length?'':'<div class="prose">沒有符合的參數。</div>'}`;}
function renderReference(){const p0=A.pressure({...A.preset('wall'),loadMode:'aci'}),load=A.verticalLoad({...A.preset('slab'),loadRule:'reference'});$('referenceView').innerHTML=`<div class="view-title"><span class="section-kicker">BASIS & VERIFICATION / 依據與算例</span><h2>規範、原書差異與驗算</h2><p>查核日期：2026-10-18。區分規範公式、專案假定與原廠容許值，保留可追溯依據。</p></div><div class="reference-grid">${sources.map(x=>`<section class="card"><div class="prose"><h3>${x.title}</h3><p>${x.note}</p>${x.url?`<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener">開啟官方來源 ↗</a>`:''}</div></section>`).join('')}</div><section class="card" style="margin-top:16px"><div class="prose"><h3>原書數值核對與修正方式</h3><ul><li><b>混用 kPa／kgf/m²：</b>原書總則寫7.2與80000R，單位不一致；本程式採完整 SI 公式，再以9.80665轉換。H=3.4m、ρ=2300時液壓為7820kgf/m²；原書側壓段落的9660並非此組參數乘積。</li><li><b>銷釘沿用壓力：</b>柱牆頁用0.204kgf/cm²計算，與同段p≈0.3825不同；本工具從同一個p自動連動所有銷釘、拉結及構件。</li><li><b>背楞算式不一致：</b>原書第23頁出現/10與/8，10520kgf·cm實際對應/10；/8應約13148kgf·cm。M、V、δ也必須來自同一支承模型，不混用二跨與三跨係數。</li><li><b>樓板條帶寬不一致：</b>原書第51頁載重以100cm寬，S、I卻以40cm寬；本工具條帶寬、載重、I、S統一。原書247kgf·cm也不等於4.93×20²/8（應246.5）。</li><li><b>支柱長度與長細比：</b>原書樓板段落出現260、310與330cm；本工具以輸入的有效未支撐長度重算，且長細比超過200會顯示NG，不因軸力尚低就顯示全數通過。</li><li><b>材料與焊接：</b>原書面板提6063-T5、邊框6061-T6，卻共用容許應力。程式分開輸入面板、肋條及背楞有效容許值，材證未核定時保留待確認狀態。</li><li><b>撓度與活載：</b>原書總則L/360，樓板部分改L/240，且部分代入值需重算。程式統一使用當下選擇的限值；原書自重＋30%衝擊模式與設計活載模式分開。</li></ul><p>v1.1加入原圖固定端、不等跨及集中反力模型。柱箍座標由分析圖反推，仍須核對施工圖；未提供或互相矛盾的資料會另外標示。</p></div></section><section class="card"><div class="card-heading"><h2>可獨立重算的標準算例</h2></div><div class="table-wrap"><table><thead><tr><th>算例</th><th>獨立公式／預期值</th><th>本工具</th></tr></thead><tbody><tr><td>ACI柱牆低速式</td><td>7.2+785×1.5/(21+17.8)=37.547938kPa</td><td>${fmt(p0.p,6)} kPa</td></tr><tr><td>原書牆拉片500×400</td><td>37.547938×0.5×0.4／0.00980665=765.765kgf</td><td>${fmt(p0.p*.5*.4/A.KF,3)} kgf</td></tr><tr><td>原書樓板載重</td><td>2400×0.15×1.3+25=493kgf/m²</td><td>${fmt(load.q/A.KF,3)} kgf/m²</td></tr><tr><td>單跨簡支均布</td><td>M=wL²/8；V=wL/2；δ=5wL⁴/(384EI)</td><td>直接勁度法＋四次特解</td></tr><tr><td>二等跨全載</td><td>中支點M=−wL²/8；反力=3/8、5/4、3/8 wL</td><td>保留支點負彎矩</td></tr><tr><td>三等跨全載</td><td>內支點M=−wL²/10；反力=0.4、1.1、1.1、0.4 wL</td><td>逐跨求解</td></tr><tr><td>單跨中央集中力</td><td>M=PL/4；δ=PL³/(48EI)</td><td>載重節點精確建置</td></tr></tbody></table></div><div class="prose"><p>發行套件另附自動驗算程式與驗證紀錄，涵蓋均布／集中力平衡、跨數、側壓力選式與邊界、SCC／底泵切換、密度係數、載重下限、支柱長度及無效輸入。</p></div></section>`;}
function chapterBody(){const cs=Object.fromEntries(['column','wall','beamSide','smallBeam','largeBeam','largeBeamSide','largeBeamSide55','slab','slab20'].map(k=>[k,A.calculate(A.preset(k))])),get=(k,id)=>cs[k].members.find(m=>m.id===id),box=(title,html)=>`<section class="card"><div class="prose"><h3>${title}</h3>${html}</div></section>`,dc=(k,id)=>get(k,id).checks.find(v=>v.id===id+'-d'),fixedPanel=get('column','panel'),rib=get('column','rib'),bare=A.calculate({...A.preset('column'),ribSection:'rect',ribB:15,ribH:21}),bareRib=bare.members.find(m=>m.id==='rib'),cross=get('column','cross'),waler=get('wall','waler'),small=get('beamSide','waler'),big30=get('largeBeamSide','waler'),big55=get('largeBeamSide55','waler'),floor15=get('slab','waler'),floor20=get('slab20','waler');
return `<div class="view-title"><span class="section-kicker">COLUMN / WALL / BEAM / SLAB</span><h2>柱、牆、梁、板計算詳解</h2><p>依A版圖示支承、荷重及斷面逐項重算。頁碼均指原書頁尾；此頁為固定參考算例，左側修改不會改寫這些比較基準。</p></div><div class="callout">原書採用值、分析圖四捨五入與統一單位重算可能略有差異。按「載入算例」後，可在計算過程查看全套公式、逐跨內力、撓度與判定。<br><button class="small-action" data-action="chaptersWord">匯出柱牆梁板詳解 Word</button> <button class="small-action" data-action="chaptersPrint">列印詳解／另存PDF</button></div>`+
box('共同原則：荷載 → 內力 → 應力與變形 → 連接及支撐',`<p>承載寬度bt與跨距L分開輸入。面壓p換成線載重w=pbt；彎曲fb=|M|max/S；矩形實心剪力fv=3V/(2A)；矩形管fv=VQ/(2It)。正負彎矩都取絕對值檢核。</p><div class="formula">1kgf=9.80665N；1kgf/cm²=0.0980665MPa<br>兩端固定均布：M端=−wL²/12；M中=+wL²/24；δmax=wL⁴/(384EI)<br>簡支均布：Mmax=wL²/8；Vmax=wL/2；δmax=5wL⁴/(384EI)</div><p>固定端必須有實際接合構造支持，不能只為降低撓度而選用。每跨以自身L/n及絕對上限檢核，不能把短跨撓度拿去與最長跨容許值比較。</p>`)+
box('一、柱模板（第8～16頁）',`<p>傳力為面板→縱肋／邊框→橫肋及柱箍→螺桿。原書混凝土T=21°C、R=1.5m/h、密度2300kg/m³，經驗式得到3824.8kgf/m²，後續取3825kgf/m²。液壓上限2300×3.4=7820kgf/m²，原列9660不符此組參數。若改用完整ACI SI式，則為37.547938kPa，勿把7.2與80000混用。</p><div class="formula">面板採1000mm寬條帶、t=4mm、L=135mm，兩端固定<br>I=bt³/12；S=bt²/6；Av=2bt/3<br>fb=${fmt(fixedPanel.fb/A.ST,3)}kgf/cm²；δ=${fmt(fixedPanel.deflection,5)}mm ≤ ${fmt(fixedPanel.deltaAllow,5)}mm</div><p>原書取220cm寬條帶，本工具改用100cm；荷載、I、S同步正規化，因此應力與撓度不因任選板條寬度而改變。</p><div class="formula">縱肋：跨距550 / 400 / 350 / 300 / 300 / 300mm，兩外端固定<br>bt=(135+115)/2=125mm；I=1.56cm⁴、S=1.10cm³<br>|M|max=${fmt(rib.Mmax/1e6,6)}kN·m；δ=${fmt(rib.deflection,5)}mm<br>支承反力（kN）=${rib.reactions.map(v=>fmt(v.R/1000,5)).join(' / ')}</div><p>原圖使用w=4.69kN/m時，直接求解可重現|M|max=0.130214kN·m及δ=1.235758mm。以原p=3825kgf/m²統一換算則w=4.688805kN/m，差異約0.03%。</p><div class="formula">若只是21×15mm實心矩形：I=1.157625cm⁴，而非1.56<br>相同支承下δ=${fmt(bareRib.deflection,5)}mm ＞ 550/360=1.52778mm</div><p>因此，原有效I須由型材／面板共同作用證明；僅用文字實心矩形不能保留原合格結論。</p><div class="formula">橫肋：L=500mm兩端固定，位置135 / 250 / 365mm<br>集中力由縱肋最大反力×1 / 0.92 / 1連動<br>|M|max=${fmt(cross.Mmax/1e6,6)}kN·m；Vmax=${fmt(cross.Vmax/1000,6)}kN<br>30×43×2.5mm完整方管Q=${fmt(cross.geometry.Q/1000,6)}cm³<br>fv=${fmt(cross.fv/A.ST,3)}kgf/cm²；δ=${fmt(cross.deflection,5)}mm</div><p>按原圖明列P=2.277、2.094、2.277kN直接驗算，得到|M|max=0.35527335kN·m、Vmax=3.324kN、δ=0.51110976mm，與圖吻合；不得沿用文字0.130kN·m及1.355kN。</p><p>90cm柱邊的柱箍集中力為573.75、1032.75、459kgf。為重現分析圖，可反推支點0/550/1100mm、荷重點105/605/1005mm，得到M約0.484121kN·m；原圖未標這些座標，須核對施工圖，不能直接延用到245cm柱邊。</p><div class="formula">螺桿60×60cm：N=0.3825×60×60=1377kgf ≤ 2800kgf<br>銷釘25×40cm：N=382.5kgf；d=1.6cm，A=2.010619cm²<br>名目單剪fv≈190.24kgf/cm²；孔壁承壓及整組容量另取小值</div><button class="small-action" data-preset="column">載入柱模板原圖模型</button>`)+
box('二、牆模板（第17～24頁）',`<p>面板及肋材沿用柱模板模型；另外檢查40×60×3mm鋼背楞、拉片與組立抗風斜撐。</p><div class="formula">p=0.3825kgf/cm²；背楞分攤高度110cm，w=42.075kgf/cm<br>支點間距50cm；I=27.3852cm⁴、S=9.1284cm³<br>若用/10：M=10518.75kgf·cm；若用/8：M=13148.4375kgf·cm</div><p>原書/10與/8印在同一算式，但10520實際對應/10。M用/10、V用5/8、δ用1/185，也不能直接稱為同一個精確梁模型。程式以所選支承一次求解三者；本參考例採二等跨、外端鉸支，因此支點負彎矩用wL²/8。</p><div class="formula">同一二跨模型：fb=${fmt(waler.fb/A.ST,3)}kgf/cm²；fv=${fmt(waler.fv/A.ST,3)}kgf/cm²<br>δ=${fmt(waler.deflection,5)}mm；容許=${fmt(waler.deltaAllow,5)}mm</div><p>方管剪應力使用完整上半截面Q及2t，而非把外高2Ht當成精確等效剪力面積。</p><div class="formula">拉片：N=0.3825×40×50=765kgf<br>A=0.2×1.8=0.36cm²；Ta=2400×0.36=864kgf；D/C=0.885417<br>原風壓150kgf/m²、間距1.8m、牆高3.4m：Hw=918kgf<br>斜撐L=250cm、水平投影130cm：N=918×250/130=1765.385kgf</div><p>鋼管要由KL/r、Cc與ASD柱式重算，並取原廠伸長容量及錨定能力之較小值；風壓150kgf/m²僅為原書假定。原書1854.7kgf尚須與實際採用管徑、E及有效長度一致，不能只引用結論。</p><button class="small-action" data-preset="wall">載入牆模板原圖模型</button>`)+
box('三、梁模板：側模與底模分開（第25～49頁）',`<p>小梁代表35×70cm，大梁50×80cm。側模依梁深取液壓；底模改用含鋼筋自重、模板及原書30%附加衝擊。參考重算未補足ACI施工活載，正式設計須切換載重模式。</p><div class="formula">小梁側：ps=2300×0.7=1610kgf/m²<br>小梁底：q=2400×0.7×1.3+25=2209kgf/m²<br>面板L=120mm固定端，應取端負彎矩wL²/12，不能只取較小跨中正彎矩<br>縱肋300+300mm、兩外端固定；橫肋於120/230mm連動縱肋反力</div><p>小梁側背楞分攤55cm、跨60cm，依50×50×2.5mm幾何自算：fb=${fmt(small.fb/A.ST,2)}kgf/cm²、δ=${fmt(small.deflection,4)}mm。原文標3mm，但原I=17.91cm⁴對應2.5mm，應確認實物。</p><div class="formula">小梁底單排80×35cm：N=0.2209×80×35=618.52kgf<br>梁底銷釘：N=0.2209×25×40=220.9kgf，非原文204kgf</div><p>鋼管容許力隨淨長變更；第5頁250cm支柱的1900kgf不能直接套到260cm，程式會重算理論容量並與原廠容許力取小值。</p><div class="formula">大梁側：ps=2300×0.8=1840kgf/m²<br>縱肋375+350+375mm，兩外端固定；負彎矩約0.02755kN·m，不能取跨中0.0138代替<br>背楞跨110cm，原計算分攤30cm：fb=${fmt(big30.fb/A.ST,2)}kgf/cm²、δ=${fmt(big30.deflection,4)}mm<br>依配置分攤55cm：fb=${fmt(big55.fb/A.ST,2)}kgf/cm²、δ=${fmt(big55.deflection,4)}mm<br>容許Fb=1440kgf/cm²；δa=1100/360=3.05556mm</div><p>30cm與55cm不能共用同一個OK；55cm情況的彎曲及撓度均超限。若實際方管為3mm，可改幾何再算，不能默認原薄管計算已涵蓋較大間距。</p><div class="formula">大梁底正確自重=2400×0.8=1920kgf/m²<br>衝擊=0.3×1920=576kgf/m²<br>q=1920+25+576=2521kgf/m²，非2417<br>雙排、縱距130cm：N=0.2521×130×50/2=819.325kgf/支</div><p>雙排平均分配須由支撐頭與實際配置成立。梁底未設獨立龍骨時，本例停用額外龍骨，邊框及免拆頭直接傳力仍需對應檢核，不能另套一根樓板龍骨造成錯誤模型。</p><button class="small-action" data-preset="smallBeam">載入小梁底模</button> <button class="small-action" data-preset="largeBeam">載入大梁底模</button> <button class="small-action" data-preset="largeBeamSide55">載入55cm側背楞</button>`)+
box('四、樓板：完成原貼文中斷部分（第50～53頁）',`<div class="formula">15cm板：q=2400×0.15×1.3+25=493kgf/m²<br>20cm板：q=2400×0.20×1.3+25=649kgf/m²<br>若另加250kgf/m²施工活載，分別為743及899kgf/m²</div><p>局部面板採200mm簡支條帶，荷載、I、S使用同一寬度。原書荷載採100cm、斷面卻採40cm，需同步修正，不能只改一個數字。</p><div class="formula">龍骨：bt=40cm、L=120cm、I=14.2cm⁴、E=710100kgf/cm²<br>15cm板w=0.0493×40=1.972kgf/cm<br>δ=5×1.972×120⁴/(384×710100×14.2)×10<br>δ15=${fmt(floor15.deflection,6)}mm；δ20=${fmt(floor20.deflection,6)}mm<br>L/240=5.000mm；L/360=3.333mm</div><p>因此15cm與20cm兩組都超過L/240；原書「0.5cm小於0.5cm」且列OK不成立，也不能靠先四捨五入再判定通過。若正式設計改採更高施工載重，須重新檢核。</p><div class="formula">支柱分攤90×120cm：N15=0.0493×90×120=532.44kgf<br>N20=0.0649×90×120=700.92kgf<br>銷釘30×30cm：N15=44.37kgf；N20=58.41kgf<br>不得沿用原書銷釘段落0.2677或204kgf</div><p>支柱長度原書出現260/310/330cm。此處依340cm樓高扣板厚及10cm構造厚，15cm板暫用315cm、20cm板310cm；實際仍以施工圖的未側撐長度為準。若採330cm且KL/r大於200，本模型會列NG，即使N仍小於理論Pa也不掩蓋長細比超限。</p><button class="small-action" data-preset="slab">載入15cm樓板</button> <button class="small-action" data-preset="slab20">載入20cm樓板</button>`);
}
